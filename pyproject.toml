[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-realtime-convo"
version = "0.1.0"
description = "Configuration foundation for OpenAgent's future realtime conversation service."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "OpenAgent" }]
dependencies = []

[project.scripts]
openagent-realtime-config = "openagent_realtime_convo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
exclude = ["^\\.git/", "^\\.venv/"]
