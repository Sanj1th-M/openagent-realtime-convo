name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-static-analysis:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.2.2; Dependabot maintains this SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Pinned to actions/setup-python v5.6.0; Dependabot maintains this SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Scan tracked production Python files with Bandit
        shell: bash
        run: |
          mapfile -t python_files < <(git ls-files '*.py' ':!tests/**')
          if (( ${#python_files[@]} )); then
            bandit -ll "${python_files[@]}"
          else
            echo "No tracked production Python files exist yet; Bandit will scan them once added."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Pinned to actions/checkout v4.2.2; Dependabot maintains this SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize CodeQL
        # GitHub recommends the moving v4 major tag so CodeQL receives service updates.
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
