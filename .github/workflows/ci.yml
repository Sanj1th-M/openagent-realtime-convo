name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.2.2; Dependabot maintains this SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Pinned to actions/setup-python v5.6.0; Dependabot maintains this SHA.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install PortAudio development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install package
        run: python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest
      - name: Type check
        run: mypy
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
